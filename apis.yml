name: Berry Health
description: 'Berry Health is a consumer digital-health company founded in 2023 by British-Ghanaian
  physician Dr. Fredua Akosa, headquartered in Accra, Ghana, that delivers online medical consultations,
  prescriptions and nationwide medication delivery for stigmatized and underserved conditions — sexual
  health, mental health and therapy, dermatology and skincare, and hair loss. Patients consult licensed
  doctors and clinical psychologists remotely, receive a personalized treatment regimen, and have
  medication delivered discreetly to their door. The company is licensed by Ghana''s Health Facility
  Regulatory Agency and the Data Protection Commission. In June 2023 it raised a $1.6M pre-seed round
  co-led by Lightspeed Venture Partners — Lightspeed''s first investment in Africa — and General
  Catalyst, with angels including Reddit COO Jen Wong, Thirty Madison co-founders Demetri Karagas and
  Steven Gutentag, and former US Surgeon General Regina Benjamin. Berry Health is a direct-to-consumer
  telehealth service; as of this enrichment pass it publishes no public API, developer portal, or SDK,
  and its consumer web properties (ourberry.com, app.ourberry.com, ourberry.io) are offline or parked.'
